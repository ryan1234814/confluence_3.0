<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Confluence 3.0</title>
    <script>
      // Redirect all 404s to index.html so React Router can handle the path
      var pathSegmentsToKeep = 1; // keep /confluence_3.0/
      var l = window.location;
      l.replace(
        l.protocol +
          "//" +
          l.hostname +
          (l.port ? ":" + l.port : "") +
          l.pathname
              .split("/")
              .slice(0, 1 + pathSegmentsToKeep)
              .join("/") +
          "/?/" +
          l.pathname
            .slice(1)
            .split("/")
            .slice(pathSegmentsToKeep)
            .join("/")
            .replace(/&/g, "~and~")
            .replace(/\?/g, "~q~")
            .replace(/#/g, "~hash~") +
          (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
          l.hash
      );
    </script>
  </head>
  <body></body>
</html>
